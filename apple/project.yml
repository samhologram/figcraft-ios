# XcodeGen spec. Generate with: cd apple && xcodegen generate   (FigCraft.xcodeproj is gitignored)
name: FigCraft
options:
  bundleIdPrefix: ca.hologram
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "$(FIGCRAFT_MARKETING_VERSION)"
    FIGCRAFT_MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
packages:
  FigCraftKit:
    path: FigCraftKit
targets:
  FigCraft:
    type: application
    platform: iOS
    sources:
      - path: FigCraft
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
    dependencies:
      - package: FigCraftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.figcraft
        PRODUCT_NAME: FigCraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Check FigCraftBridge.xcframework
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "${SRCROOT}/FigCraftKit/FigCraftBridge.xcframework" ] || [ ! -f "${SRCROOT}/FigCraftKit/Sources/FigCraftKit/figcraft_apple.swift" ]; then
            echo "error: FigCraftBridge.xcframework (or generated figcraft_apple.swift) is missing: run apple/scripts/build-xcframework.sh"
            exit 1
          fi
    info:
      path: build/Info/FigCraft-Info.plist
      properties:
        CFBundleDisplayName: FigCraft
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: FigCraft Design
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [ca.hologram.figcraft.document]
          - CFBundleTypeName: Figma Design
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.figma.fig]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ca.hologram.figcraft.document
            UTTypeDescription: FigCraft Design
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [figcraft]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.figma.fig
            UTTypeDescription: Figma Design
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fig]
  FigCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FigCraftTests
    dependencies:
      - target: FigCraft
      - package: FigCraftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.figcraft.tests
        GENERATE_INFOPLIST_FILE: YES
  FigCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FigCraftUITests
    dependencies:
      - target: FigCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.figcraft.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FigCraft
schemes:
  FigCraft:
    build:
      targets:
        FigCraft: all
        FigCraftTests: [test]
        FigCraftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FigCraftTests, FigCraftUITests]

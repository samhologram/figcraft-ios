[package]
name = "figcraft-apple"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Fork-only crate: its own workspace so the upstream workspace manifest stays untouched.
[workspace]

[lib]
crate-type = ["staticlib", "lib"]
name = "figcraft_apple"

[dependencies]
figcraft-engine = { path = "../../crates/engine" }
figcraft-doc = { path = "../../crates/doc" }
figcraft-geom = { path = "../../crates/geom" }
figcraft-color = { path = "../../crates/color" }
figcraft-render = { path = "../../crates/render" }
figcraft-text = { path = "../../crates/text" }
serde_json = "1"
base64 = "0.22"
tiny-skia = "0.12"
uniffi = "0.32"
thiserror = "2"

[features]
# Only needed to run the `uniffi-bindgen` binary (Swift binding generation); never shipped in the app.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
